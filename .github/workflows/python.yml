name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e 'apps/api[dev]'

      - name: Compile API package
        run: python -m compileall -q apps/api/hubgit_api

      - name: Run API tests when present
        shell: bash
        run: |
          if find apps/api/tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit 2>/dev/null | grep -q .; then
            python -m pytest apps/api/tests
          else
            echo "No API test files are checked in yet; compile check passed."
          fi
