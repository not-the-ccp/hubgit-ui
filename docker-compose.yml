name: hubgit

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      HUBGIT_ENVIRONMENT: ${HUBGIT_ENVIRONMENT:-development}
      HUBGIT_DATABASE_URL: sqlite+aiosqlite:////data/hubgit.db
      HUBGIT_DATA_DIR: /data
      HUBGIT_COOKIE_SECURE: ${HUBGIT_COOKIE_SECURE:-false}
      HUBGIT_PUBLIC_BASE_URL: ${HUBGIT_PUBLIC_BASE_URL:-http://localhost:3000}
      HUBGIT_CORS_ORIGINS: ${HUBGIT_CORS_ORIGINS:-http://localhost:3000}
      HUBGIT_SEED_MOCK_USER: ${HUBGIT_SEED_MOCK_USER:-true}
    ports:
      - "${HUBGIT_API_PORT:-8000}:8000"
    volumes:
      - hubgit-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      HUBGIT_API_ORIGIN: ${HUBGIT_API_ORIGIN:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HUBGIT_WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  hubgit-data:
